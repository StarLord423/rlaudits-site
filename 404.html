<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — RLAudits</title>
<meta name="robots" content="noindex">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0E1F3A;
    --navy-deep: #091428;
    --gold: #B68A3E;
    --gold-soft: #D4B074;
    --paper: #FBFAF6;
    --ink2: #3C4A63;
    --rule: #DCD6C6;
    --sans: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --serif: Georgia, "Times New Roman", serif;
    --mono: "Courier New", monospace;
  }
  body { min-height: 100vh; font-family: var(--sans); background: var(--paper); color: var(--navy); display: grid; place-items: center; padding: 32px; }
  main { width: min(720px, 100%); border: 1px solid var(--rule); background: #fff; box-shadow: 0 24px 70px rgba(9,20,40,.12); }
  .head { background: var(--navy); color: #fff; padding: 28px 32px; border-bottom: 4px solid var(--gold); }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-soft); margin-bottom: 12px; }
  h1 { font-family: var(--serif); font-size: clamp(36px, 6vw, 54px); line-height: 1.02; font-weight: 500; }
  .body { padding: 30px 32px 34px; }
  p { color: var(--ink2); font-size: 16px; line-height: 1.65; margin-bottom: 22px; }
  a { display: inline-flex; align-items: center; padding: 13px 18px; background: var(--gold); color: var(--navy-deep); text-decoration: none; font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
  a:hover { background: var(--gold-soft); }
</style>
</head>
<body data-track-service="404">
<main>
  <section class="head">
    <div class="eyebrow">404 / Not public</div>
    <h1>That page is not available.</h1>
  </section>
  <section class="body">
    <p>The public RLAudits site only exposes customer-facing pages and samples. Internal folders, operator notes, and working documents are not published.</p>
    <a href="/">Return to RLAudits</a>
  </section>
</main>
<script defer src="/assets/rlaudits-tracking.js"></script>
</body>
</html>
